<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/sds-web-a87a9e9b-2cd4-477d-89f9-a3904adddecc/colors_and_type.css">
<link rel="stylesheet" href="_ds/sds-web-a87a9e9b-2cd4-477d-89f9-a3904adddecc/ui_kits/sds-desktop/sds-desktop.css">
<script src="_ds/sds-web-a87a9e9b-2cd4-477d-89f9-a3904adddecc/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</helmet>
<div style="overflow-x:auto;">
  <table class="sds-table" style="min-width:1500px;">
    <thead>
      <tr>
        <th style="width:46px;"><div class="cb"></div></th>
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="10">
          <th class="sortable" style="white-space:normal; min-width:110px;">{{ c }} <i class="fa-solid fa-sort sortarrow"></i></th>
        </sc-for>
        <th style="min-width:110px;">Status</th>
        <th style="width:120px;">Ações</th>
      </tr>
    </thead>
    <tbody>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
        <tr class="{{ r.rowClass }}">
          <td><div class="cb {{ r.cbClass }}" data-hs="{{ r.cbHs }}" onClick="{{ r.onCheck }}" style="cursor:{{ r.cbCursor }};"><i class="fa-solid fa-check"></i></div></td>
          <sc-for list="{{ r.cells }}" as="cell" hint-placeholder-count="10">
            <td style="white-space:nowrap;">{{ cell }}</td>
          </sc-for>
          <td><span class="badge {{ r.badgeClass }}">{{ r.status }}</span></td>
          <td style="position:relative;">
            <button class="btn btn-default btn-small" disabled="{{ r.disabled }}" data-hs="{{ r.acHs }}" onClick="{{ r.onAcoes }}" style="min-width:96px; justify-content:space-between; cursor:{{ r.acCursor }};">Ações <i class="fa-solid fa-caret-down"></i></button>
            <sc-if value="{{ r.open }}" hint-placeholder-val="{{ false }}">
              <div class="menu" style="position:absolute; top:44px; right:10px; z-index:20; min-width:220px;">
                <sc-for list="{{ r.items }}" as="mi" hint-placeholder-count="2">
                  <div class="menu-item" data-hs="{{ mi.hs }}" onClick="{{ mi.onPick }}" style="cursor:{{ mi.cursor }}; color:{{ mi.color }};">{{ mi.label }}</div>
                </sc-for>
              </div>
            </sc-if>
          </td>
        </tr>
      </sc-for>
    </tbody>
  </table>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:520},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{cells:string[],status:string}&gt;&quot;},&quot;highlight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;tsType&quot;:&quot;number&quot;},&quot;cbRow&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;tsType&quot;:&quot;number&quot;},&quot;acRow&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;tsType&quot;:&quot;number&quot;},&quot;onCheck&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;menuItems&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;liveItems&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(label:string,index:number)=&gt;void&quot;}}">
const COLS = ['Código da empresa','Nome da empresa','Código do colaborador','Nome do colaborador','Início do período aquisitivo','Fim do período aquisitivo','Início das férias','Fim das férias','Dias de férias','Dias de abono'];

class Component extends DCLogic {
  state = { open: -1 };

  componentDidUpdate(prev) {
    if (prev.rows !== this.props.rows && this.state.open !== -1) this.setState({ open: -1 });
  }

  renderVals() {
    const hl = this.props.highlight ?? -1;
    const cbRow = this.props.cbRow ?? -1;
    const acRow = this.props.acRow ?? -1;
    const onCheck = this.props.onCheck;
    const onPick = this.props.onPick;
    const labels = this.props.menuItems || [];
    const live = this.props.liveItems || [];

    const rows = (this.props.rows || []).map((r, idx) => {
      const on = idx === hl;
      const canCheck = idx === cbRow;
      const canAcoes = idx === acRow;
      const open = canAcoes && this.state.open === idx;
      return {
        cells: r.cells,
        status: r.status,
        rowClass: on ? 'selected' : '',
        cbClass: on ? 'checked' : '',
        cbHs: canCheck ? '1' : null,
        cbCursor: canCheck ? 'pointer' : 'default',
        onCheck: canCheck && onCheck ? onCheck : null,
        badgeClass: r.status === 'Calculada' ? 'yellow' : 'blue',
        disabled: !canAcoes && r.status === 'Programada' && !on,
        acHs: canAcoes ? '1' : null,
        acCursor: canAcoes ? 'pointer' : 'default',
        onAcoes: canAcoes ? () => this.setState(s => ({ open: s.open === idx ? -1 : idx })) : null,
        open,
        items: labels.map(label => {
          const isLive = live.indexOf(label) !== -1;
          return {
            label,
            hs: isLive ? '1' : null,
            cursor: isLive ? 'pointer' : 'default',
            color: isLive ? 'var(--sds-fg-default)' : 'var(--sds-fg-muted)',
            onPick: isLive && onPick ? () => { this.setState({ open: -1 }); onPick(label, idx); } : null
          };
        })
      };
    });
    return { cols: COLS, rows };
  }
}

</script>
</body>
</html>
